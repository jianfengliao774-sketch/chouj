<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>销毁记录 · 芯火夺宝</title></head>
<body>
<!-- The build inserts this panel into index.html, sharing the exact player shell. -->
<!-- burn-panel:start -->
<section id="panel-burns" hidden role="tabpanel" aria-labelledby="tab-burns">
<section class="card burn-intro"><span class="eyebrow" data-en="XINHUO · BURN RECORDS">芯火夺宝 · 销毁记录</span><h1 data-en="Every burn, onchain">每一笔销毁，链上可查</h1><p data-en="Settled rounds send 4% to the dead address. In the new pools, incomplete funding after 24 hours opens a 24-hour claim window. Once it expires, remaining unclaimed principal can be sent to the dead address in an onchain transaction.">成功开奖后，4% 转入销毁地址。新场次在 24 小时未凑满后，开放 24 小时本金领取期；到期未领取的剩余本金可通过链上交易统一转入销毁地址。</p><p class="record-note" data-en="Records appear after transaction confirmation. Sending tokens to the dead address does not decrease the token contract’s totalSupply.">记录在交易确认后展示。转入销毁地址不会减少代币合约的 totalSupply。</p><span class="eyebrow" data-en="DEAD ADDRESS">销毁地址</span><p class="burn-address"><a href="https://bscscan.com/address/0x000000000000000000000000000000000000dEaD" target="_blank" rel="noopener noreferrer">0x000000000000000000000000000000000000dEaD</a></p></section>
<section class="card burn-list"><div class="burn-toolbar"><label for="burn-pool" data-en="Pool">场次</label><select id="burn-pool"><option value="all" data-en="All confirmed records">全部已确认记录</option><option value="1" data-en="1 BEM test">1 BEM 测试</option><option value="10">10 BEM</option><option value="50">50 BEM</option><option value="100">100 BEM</option><option value="legacy100" data-en="Original contract · 100 BEM">原合约 · 100 BEM</option></select><button type="button" id="burn-refresh" data-en="Refresh records">刷新记录</button><span id="burn-status" class="record-note" aria-live="polite">读取链上记录…</span></div><div id="burn-records"></div><div class="burn-pager"><button type="button" id="burn-prev" disabled data-en="Previous">上一页</button><span id="burn-page">1 / 1</span><button type="button" id="burn-next" disabled data-en="Next">下一页</button></div></section>
</section>
<!-- burn-panel:end -->
</body></html>
