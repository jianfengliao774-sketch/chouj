# Canonical domain: https://tapeout.cc.cd
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name tapeout.cc.cd www.tapeout.cc.cd 144.126.242.139 188.166.187.64;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/bem2075-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://tapeout.cc.cd$request_uri; }
}
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name 144.126.242.139 188.166.187.64;
    ssl_certificate /etc/letsencrypt/live/bem2075-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bem2075-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 308 https://tapeout.cc.cd$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.tapeout.cc.cd;
    ssl_certificate /etc/letsencrypt/live/bem2075-domain/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bem2075-domain/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 308 https://tapeout.cc.cd$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tapeout.cc.cd;
    ssl_certificate /etc/letsencrypt/live/bem2075-domain/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bem2075-domain/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/bem2075.access.log;
    error_log /var/log/nginx/bem2075.error.log;
    client_max_body_size 256k;
    limit_conn bemconn 80;
    limit_conn_status 429;
    limit_req_status 429;
    error_page 429 = @bem_limited;
    location @bem_limited {
        default_type application/json;
        add_header Retry-After 10 always;
        return 429 '{"error":"Too many requests; retry shortly"}';
    }
    location = /rpc {
        # 5,000 selected tickets encode to ~320 KB; match the app 512 KiB cap.
        client_max_body_size 512k;
        limit_req zone=bemrpc_ip burst=40 nodelay;
        limit_req zone=bemrpc_global burst=160 nodelay;
        proxy_pass http://bem2075_app;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
    }
    location = /api/admin/login {
        limit_req zone=bemlogin_ip burst=3 nodelay;
        limit_req zone=bemlogin_global burst=4 nodelay;
        proxy_pass http://bem2075_app;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
    }
    location ^~ /api/ {
        limit_req zone=bemapi_ip burst=30 nodelay;
        limit_req zone=bemapi_global burst=80 nodelay;
        proxy_pass http://bem2075_app;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
    }
    # Public build artifacts only; private release directories stay unreadable to nginx.
    location ~ ^/assets/[a-zA-Z0-9_.-]+$ {
        root /var/www/bem2075-static;
        try_files $uri =404;
        limit_except GET { deny all; }
        gzip_static on;
        gzip_vary on;
        gzip_types text/css application/javascript text/javascript image/svg+xml;
        gzip_min_length 1024;
        gzip_comp_level 5;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location / {
        proxy_pass http://bem2075_app;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
    }
}
